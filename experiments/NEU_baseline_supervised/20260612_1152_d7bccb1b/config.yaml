experiment:
  name: NEU_baseline_supervised
  seed: 42
  device: cuda
  exp_dir: experiments/
data:
  data_dir: data/raw/Neu_Surface/train/images
  test_dir: data/raw/Neu_Surface/validation/images
  val_split: 0.15
  test_split: 0.0
  augmentation: true
  num_workers: 6
  image_size: 224
model:
  name: resnet50
  pretrained: true
  num_classes: null
training:
  epochs: 20
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  early_stopping_patience: 0
  scheduler: cosine
  warmup_epochs: 2
  grad_clip_norm: 1.0
  label_smoothing: 0.1
  backbone_lr_factor: 0.1
  freeze_backbone_epochs: 2
  loss_fn: combined
  supcon_temperature: 0.07
  supcon_weight: 0.5
active_learning:
  num_cycles: 1
  initial_pool_size: 99999
  batch_size_al: 1
  sampling_strategy: entropy
  uncertainty_method: entropy
  reset_mode: continue
  step_mode: false
  auto_annotate: true
  stratified_init: true
checkpoint:
  save_best_model: true
  save_best_per_cycle: true
  save_every_n_epochs: 5
logging:
  level: INFO
  log_to_file: true
